# Groups every container for this site under one Compose project (aida26_*),
# independent of the folder name.
name: aida26

# One source for the app DB credentials — the database service reads them to create the roles/db
# on first init (via bootstrap.sh), the backend reads them to connect. Override any per-var in .env.
x-db-credentials: &db-credentials
  DB_NAME: ${DB_NAME:-professional_agenda}
  DB_USER: ${DB_USER:-aida26_user}
  DB_PASSWORD: ${DB_PASSWORD:-CambiaEsta!}
  DB_OWNER_USER: ${DB_OWNER_USER:-aida26_owner}
  DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-CambiaEsta_Owner!}

services:
  database:
    image: postgres:18-alpine
    container_name: aida26_database
    environment:
      <<: *db-credentials
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASS:-CambiaEsta_Super!}
      # No POSTGRES_DB: the app database is created by bootstrap.sh owned by
      # DB_OWNER_USER, so the image must not create it owned by the superuser.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
    networks:
      - aida26_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aida26_backend
    environment:
      <<: *db-credentials
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      VERSION: ${VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-yourpassword}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - aida26_network
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/package.json:/app/backend/package.json
      - ./backend/tsconfig.json:/app/backend/tsconfig.json
      - ./database/migrations:/app/database/migrations
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - ./shared/src:/app/shared/src
    # Startup command and healthcheck are owned by backend/Dockerfile.

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aida26_frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - aida26_network
    environment:
      # Vite proxies /api to the backend service over the compose network.
      - API_PROXY_TARGET=http://backend:3000
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/styles:/app/frontend/styles
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - ./shared/src:/app/shared/src

volumes:
  postgres_data:

networks:
  aida26_network:
    driver: bridge
