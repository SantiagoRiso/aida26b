name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Unit, DB, and E2E tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        # Superuser only. The owner and application roles are created by database/bootstrap.sh in
        # the step below, exactly as the local stack does — no POSTGRES_DB, because the app database
        # must be owned by the owner role rather than by the superuser.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Three genuinely distinct roles, mirroring docker-compose.yml: superuser (cluster bootstrap
      # and the db-test harness), owner (migrations and seeds), app (the server under test). Collapsing
      # them makes every app-grant assertion vacuous, since a superuser or table owner passes
      # has_table_privilege unconditionally.
      DB_HOST: localhost
      DB_PORT: 5544
      DB_NAME: professional_agenda
      DB_USER: aida26_user
      DB_PASSWORD: aida26pass
      DB_OWNER_USER: aida26_owner
      DB_OWNER_PASSWORD: aida26ownerpass
      # backend/test/helpers.ts connects its harness pool with these.
      POSTGRES_SUPERUSER: postgres
      POSTGRES_SUPERPASS: postgres
      NODE_ENV: test
      # Argentina-only app: run the whole job (Node runner + Chromium's default clock) in the business
      # timezone so times render as they do in production, not the runner's UTC.
      TZ: America/Argentina/Buenos_Aires
      PORT: 3000
      # Tells playwright.config.mts to skip the webServer block (CI manages the stack).
      CI: "true"
      E2E_BASE_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # Root package holds only the ESLint toolchain (the lint step below runs `eslint .` from here).
      - name: Install root dependencies
        run: npm ci

      # The postgres image runs this from /docker-entrypoint-initdb.d on a fresh volume in the local
      # stack; a service container gets no such mount, so run the same script by hand. Reusing it
      # keeps role creation single-sourced instead of a parallel CI-only scheme.
      - name: Bootstrap DB roles and application database
        run: |
          if ! command -v psql > /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          sh database/bootstrap.sh
        env:
          POSTGRES_USER: postgres
          PGHOST: localhost
          PGPORT: 5544
          PGPASSWORD: postgres

      - name: Run migrations
        run: npm run migrate --prefix backend

      - name: Seed demo data
        run: npm run seed:demo --prefix backend

      # Chromium only for speed; all journeys use the default browser.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # ESLint over the whole tree (src, test, and e2e specs). A non-zero exit — any error-level
      # rule, including the app-wide `unknown` ban and lint-suppression hygiene — fails the build.
      - name: Lint
        run: npm run lint

      # vite build does not type-check, so the compiler only ever runs here. `npm run typecheck`
      # now also type-checks the frontend e2e specs (tsconfig.playwright.json) and every file under
      # frontend/test (glob, not a hand-maintained list).
      - name: Type-check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build --prefix frontend

      # tsconfig rootDir spans the repo (backend imports shared/), so tsc mirrors the tree under
      # dist/ — the entry lands at backend/dist/backend/src/server.js.
      - name: Build backend
        run: npm run build --prefix backend

      - name: Backend unit tests
        run: npm run test:coverage --prefix backend

      # Includes migration-seed-fresh.test.ts, which exercises migrations against a fresh schema.
      # Runs WITH coverage so the routes/db/services thresholds in vitest.db.config.mts (statements
      # 78 / branches 65 / functions 85 / lines 80) actually gate — the suite's only ambitious
      # thresholds, dead config until now because CI ran the plain suite. An earlier note reported
      # the v8 report/merge hanging here; it did not reproduce against real Postgres (the full suite
      # completed and wrote its report in ~150s), so coverage is enforced rather than skipped.
      - name: Backend DB tests (coverage — gates the routes/db/services thresholds)
        run: npm run test:db:coverage --prefix backend

      - name: Frontend unit tests
        run: npm run test:coverage --prefix frontend

      - name: Start backend server
        run: node backend/dist/backend/src/server.js &
        env:
          PORT: 3000

      - name: Wait for server
        run: |
          echo "Waiting for server at http://localhost:3000/health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Server ready."
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in 30s."
          exit 1

      # Full E2E suite — 40 spec files / 148 tests (desktop + mobile projects), workers:1 (serial,
      # shared seeded DB).
      - name: Frontend E2E tests
        run: npm run test:e2e --prefix frontend
        env:
          E2E_BASE_URL: "http://localhost:3000"
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
