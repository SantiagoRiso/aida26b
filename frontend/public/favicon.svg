<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <style>
      .tile { fill: url(#tile); stroke: #1e40af; stroke-width: 1; }
      @media (prefers-color-scheme: dark) { .tile { stroke: #93c5fd; } }
    </style>
  </defs>

  <!-- app tile background -->
  <rect class="tile" x="1" y="1" width="30" height="30" rx="7"/>

  <!-- calendar + badge, scaled up together about their center -->
  <g transform="translate(16 15.5) scale(1.1) translate(-16 -15.5)">
    <!-- back sheet (stacked-paper depth) -->
    <rect x="10.5" y="8.5" width="13" height="15" rx="2" fill="#dbeafe"/>

    <!-- binding rings -->
    <rect x="11" y="4.6" width="2.2" height="4.4" rx="1.1" fill="#ffffff"/>
    <rect x="18.6" y="4.6" width="2.2" height="4.4" rx="1.1" fill="#ffffff"/>

    <!-- front calendar sheet (top tucked under the header to avoid a hairline seam) -->
    <rect x="8" y="7.2" width="15" height="15.8" rx="2.2" fill="#ffffff"/>

    <!-- header band (overshoots the sheet's top edge so no white peeks through) -->
    <path d="M10.2 6.5H20.8A2.2 2.2 0 0 1 23 8.7V11H8V8.7A2.2 2.2 0 0 1 10.2 6.5Z" fill="#1d4ed8"/>

    <!-- grid (day cells): 3x2, centered in the white body -->
    <g fill="#60a5fa">
      <rect x="10.1" y="12.7" width="2.8" height="2.8" rx="0.7"/>
      <rect x="14.1" y="12.7" width="2.8" height="2.8" rx="0.7"/>
      <rect x="18.1" y="12.7" width="2.8" height="2.8" rx="0.7"/>
      <rect x="10.1" y="16.7" width="2.8" height="2.8" rx="0.7"/>
      <rect x="14.1" y="16.7" width="2.8" height="2.8" rx="0.7"/>
      <rect x="18.1" y="16.7" width="2.8" height="2.8" rx="0.7"/>
    </g>

    <!-- new-appointment badge -->
    <circle cx="22" cy="21" r="5.2" fill="#22c55e"/>
    <path d="M22 18.6V23.4M19.6 21H24.4" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
  </g>
</svg>
